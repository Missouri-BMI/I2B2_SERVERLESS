# TEMPLATE for Configuration/<env>/<project>/apache/ajp.conf (git-ignored per env).
# Copy to that path and replace {{AJP_SECRET}}.
#   {{AJP_SECRET}}  shared AJP secret; MUST match the WildFly secret-checker in
#                   the i2b2-server commands.cli for this environment.
<VirtualHost 127.0.0.1:80>
  ProxyRequests Off
  ProxyPreserveHost Off

  <Location /i2b2/services/>
      Require ip 127.0.0.1
      ProxyPass "ajp://127.0.0.1:8009/i2b2/services/" \
      secret={{AJP_SECRET}} \
      disablereuse=On \
      flushpackets=On \
      timeout=240

      ProxyPassReverse "ajp://127.0.0.1:8009/i2b2/services/"
  </Location>
</VirtualHost>
