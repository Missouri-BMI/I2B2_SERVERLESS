# TEMPLATE for Configuration/<env>/<project>/apache/sp.conf (git-ignored per env).
# For plain i2b2 hosts: copy as-is. For SHRINE hosts (<project> = *-shrine):
# also uncomment the SHRINE section at the bottom and replace
# {{PUBLIC_HOSTNAME}} / {{IDP_HOSTNAME}}. Enables Shibboleth SP auth.
#
# Configure the module for content.
#
# You MUST enable AuthType shibboleth for the module to process
# any requests, and there MUST be a require command as well. To
# enable Shibboleth but not specify any session/access requirements
# use "require shibboleth".
#

## Modified for i2b2 https://community.i2b2.org/wiki/pages/viewpage.action?pageId=55706050
<Location />
  AuthType shibboleth
  ShibRequestSetting requireSession 0
  require shibboleth
</Location>

<Location "/health">
    AuthType None
    Require all granted
    SetHandler server-status
</Location>

