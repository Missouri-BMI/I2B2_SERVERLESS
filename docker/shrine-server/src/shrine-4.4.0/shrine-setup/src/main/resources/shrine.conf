//    flaggingIconInstructions = "Flag a query"
//    nextStepsUrl = "TODO:  insert next steps URL here"
      helpLinks = {
          "Application Help": "https://open.catalyst.harvard.edu/wiki/display/SHRINE/SHRINE+Webclient+Help+Document",
          "Network Help": "https://www.actnetwork.us/national"
      } //config for application help.
//    define the entityId for all the Idp that the application needs to be integrated with.
//    NOTE: Display Value should be replaced with whichever values/text you would like to display on the UI and
//    corresponding values should be updated to the IdP entity Id.
//    ssoLinks: {
//         "Display Value": "Idp Entity Id 1",
//         "Display Value": "Idp Entity Id 2"
//    }
 //     ssoLogoutUrl = "http://mylogoutlinkforsso" //If you're using SSO, send user to this URL if logging them out
    //    sessionTimeout = "30 mins"  //Length of user session in webclient

  }//webclient

