//    bannerText = "Some SHRINE banner text" //text displayed in top left of the webclient
    siteAdminEmail = "baz@example.com"  //admin email address for this site
    // unauthorizedMessage is set in qep/service's reference.conf
//    termsOfUseText = "terms-of-use text"
//    unauthorizedMessage = "You currently do not have access to SHRINE. Please contact your institution's SHRINE administrator for more information."
//    usernameLabel = "User Name"     //text for the label displayed on login
//    passwordLabel = "User Password" //text for the label displayed on login
//    defaultNumberOfOntologyChildren = 10000 //huge default number of children to display in the ontology view
