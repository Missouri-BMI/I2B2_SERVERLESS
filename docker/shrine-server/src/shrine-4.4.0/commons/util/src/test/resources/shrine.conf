shrineTestTarget = "from shrine.conf"

overrideNetworkTestTarget = "from shrine.conf"

overrideReferenceTestTarget = "from shrine.conf"

requiredByReferenceConfValue = "from shrine.conf"

overrideVariablesConfValue = "from shrine.conf"

overrideShrineVariablesConfigValue = "from shrine.conf"

overrideShrineVariablesTestTarget = ${overrideShrineVariablesConfigValue}

nullAShrineValue = "Not null"

passwordVariablesConfValue = "from shrine.conf"

passwordShrineVariablesConfigValue = "from shrine.conf"

passwordShrineVariablesTestTarget = ${passwordShrineVariablesConfigValue}

duplicatedKey = "first value in the file"

duplicatedKey = "last value in the file"

shrine{


  email {
    javaxmail {
      mail {
        transport {
          protocol {
            rfc822 = "mocked"
          }
        }
      }
    }
  }
  i2b2BaseUrl = "http://i2b2.example.com:9090" //The local i2b2's URL as observed from this tomcat server

  //  //  For testing misplaced password (should be in password.conf)
//  hiveCredentials.password = "examplePassword"

  webclient {
      sessionTimeout="30 mins"
  }
}

sqlite = {
  url = "jdbc:sqlite:file::memory:?cache=shared"
  driver = org.sqlite.JDBC
  connectionPool = disabled
  keepAliveConnection = true
  properties {
    cache = true
  }
}

h2 = {
  url = "jdbc:h2:mem:test1;MODE=MySQL;"
  driver = org.h2.Driver
  connectionPool = disabled
  keepAliveConnection = true
}
