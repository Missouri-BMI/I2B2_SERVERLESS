shrine {
  qep {
    create = false
  }

  adapter {
    query {
      database {
        dataSourceFrom = "dataSourceConfig"//"JNDI" //Can be JNDI or dataSourceConfig . Use dataSourceConfig for command line tools and tests, JNDI everywhere else
        //jndiDataSourceName = "java:comp/env/jdbc/adapter" //or leave out for tests
        slickProfileClassName = "slick.jdbc.H2Profile$"//"slick.jdbc.MySQLProfile$" // Can be
        //        slick.jdbc.H2Profile$
        //        slick.jdbc.MySQLProfile$
        //        slick.jdbc.PostgresProfile$
        //        slick.jdbc.SQLServerProfile$
        //        slick.jdbc.JdbcProfile
        //        slick.jdbc.OracleProfile$
        //        slick.jdbc.SQLServerProfile$
        //
        //        (Yes, with the $ on the end)
        // but will be inferred to a reasonable default via shrine's shrine.shrineDatabaseType property


        // For use without JNDI
        dataSourceConfig {

          //typical test settings for unit tests
          driverClassName = "org.h2.Driver"

          //url = "jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MySQL;" //H2 embedded in-memory for unit tests
          //          url = "jdbc:h2:AdapterMapping.h2;MODE=MySQL;" //H2 embedded on disk
//          url = "jdbc:h2:~/shrine-adapter-exec-4.3.0-SNAPSHOT/databases/ADAPTER.h2;MODE=MySQL;"
        }
        timeout = "30 seconds" //time to wait before db gives up, in seconds.
        createTablesOnStart = true // set to false when running unit tests.
      }
    }
  }
}