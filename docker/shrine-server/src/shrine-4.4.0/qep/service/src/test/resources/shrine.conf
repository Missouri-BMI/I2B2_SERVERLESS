shrine {

  i2b2BaseUrl = "http://i2b2.example.com:9090" //The local i2b2's URL as observed from this tomcat server
  i2b2Domain = "foo"
  i2b2ShrineProjectName = "SHRINE"
  nodeKey = "testNode"

  lucene {
    directory = "../../ontology/lucene-indexer/target/test_lucene_index"
    maxSearchResults = 200
    suggestDirectory = "../../ontology/lucene-indexer/target/test_suggest_index"
    suggestCount = 20
  }

  hub {
    client {
      serverUrl = "https://noHostInUnitTests:6443/shrine-metadata/mom" //this is purposefully spiked.
      inProcessForTesting = "true"
    }
    messagequeue {
      implementation = "net.shrine.messagequeuemiddleware.LocalMessageQueueMiddleware" //Fully-qualified class name of the MessaageQueueService to use //todo when there are two real implemetnations, maybe leave this default out
    }
      database {
        slickProfileClassName = "slick.jdbc.H2Profile$"
        createTablesOnStart = true //for testing with H2 in memory, when not running unit tests. Set to false normally

        dataSourceFrom = "dataSourceConfig" //Can be JNDI or dataSourceConfig . Use dataSourceConfig for command line tools and tests, JNDI everywhere else

        dataSourceConfig {
          driverClassName = "org.h2.Driver"
          url = "jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MySQL;" //H2 embedded in-memory for unit tests ;TRACE_LEVEL_SYSTEM_OUT=2 for H2's trace
        }
      }
  }

  qep {
      collectQepAudit = false

      database {
        slickProfileClassName = "slick.jdbc.H2Profile$"
        createTablesOnStart = true //for testing with H2 in memory, when not running unit tests. Set to false normally

        dataSourceFrom = "dataSourceConfig" //Can be JNDI or dataSourceConfig . Use dataSourceConfig for command line tools and tests, JNDI everywhere else

        dataSourceConfig {
          driverClassName = "org.h2.Driver"
          url = "jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MySQL;" //H2 embedded in-memory for unit tests ;TRACE_LEVEL_SYSTEM_OUT=2 for H2's trace
        }
      }
  }

  authenticate {
    usersource {
      //Bogus security for testing
      type = "ConfigUserSource" //Must be ConfigUserSource (for isolated testing) or PmUserSource (for everything else)
      researcher {
        username = "ben"
        password = "kapow"
      }
      qep {
        username = "qep"
        password = "trustme"
      }
      admin {
        username = "admin"
        password = "pwd"
      }
      adminSession {
        username = "userSession"
        password = "1234567"
      }
    }
  }

  static {
    timeout = "45 seconds"
  }

  webclient {
    siteAdminEmail = "baz@foo"
    logo = "./src/test/resources/SHRINE_logo.png"
    ssoLinks: {
        HMS="http://sso.med.harvard.edu/adfs/services/trust",
        MockSAML="https://saml.example.com/entityid",
        SSOCircle="https://idp.ssocircle.com"
    }
    ssoLogoutUrl="some-logout-url"
    sessionTimeout="1 sec"
  }

  breakdownResultOutputTypes {
    PATIENT_TOP20MEDS_XML {
      description = "Top 20 Medications"
      category = "Advanced"
    }
    PATIENT_TOP3DIAG_XML {
      description = "Top 3 diagnoses breakdown"
      category = "Advanced"
    }
  }//breakdownResultOutputTypes}
}
