shrine {

  qep {
      collectQepAudit = false

      database {
        slickProfileClassName = "slick.jdbc.H2Profile$"
        createTablesOnStart = true //for testing with H2 in memory, when not running unit tests. Set to false normally

        dataSourceFrom = "dataSourceConfig" //Can be JNDI or dataSourceConfig . Use dataSourceConfig for command line tools and tests, JNDI everywhere else

        dataSourceConfig {
          driverClassName = "org.h2.Driver"
          url = "jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MySQL;" //H2 embedded in-memory for unit tests ;TRACE_LEVEL_SYSTEM_OUT=2 for H2's trace
            credentials {
              username = "notUsed"
              password = "notUsed"
            }
        }
    }
  }

  hub {
     database {
         slickProfileClassName = "slick.jdbc.H2Profile$"
         createTablesOnStart = true //for testing with H2 in memory, when not running unit tests. Set to false normally

         dataSourceFrom = "dataSourceConfig" //Can be JNDI or dataSourceConfig . Use dataSourceConfig for command line tools and tests, JNDI everywhere else

         dataSourceConfig {
           driverClassName = "org.h2.Driver"
           url = "jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MySQL;" //H2 embedded in-memory for unit tests ;TRACE_LEVEL_SYSTEM_OUT=2 for H2's trace
             credentials {
               username = "notUsed"
               password = "notUsed"
             }
         }
       }
     }
}