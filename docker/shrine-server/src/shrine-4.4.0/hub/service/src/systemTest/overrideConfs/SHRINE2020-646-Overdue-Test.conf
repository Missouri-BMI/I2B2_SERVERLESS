//overrides to shorten the ammount of time before shrine gives up on an overdue query to test SHRINE2020-646
shrine {
  hub {
    result {
      resultsOverdueAfter = "2 minutes" //If a result has not been updated in resultsOverdueAfter move it to error
      overdueResultsCheckPeriod = "10 seconds" //How often to check for overdue queries
      overdueResultsBatchSize = 3 //How big a batch to pull from the database at one go
    }
  }
}