shrine {

  shrineHubBaseUrl = "https://shrine-hub:6443" //The shrine hub's URL as observed from this tomcat server
  i2b2BaseUrl = "http://i2b2-web" //The local i2b2's URL as observed from this tomcat server
  i2b2Domain = "i2b2demo"
  i2b2ShrineProjectName = "Demo"

  nodeKey = ${NODE_NAME} //node key to get information from the hub about itself as a node.

  hub {
    client {
      tls.trustManager = "TrustAllCerts" // Should be "VerifyServerCerts", but can be "TrustAllCerts" to allow man-in-the-middle attacks
    }
    database {
        dataSourceFrom = "JNDI" //Can be JNDI or dataSourceConfig . Use dataSourceConfig for command line tools and tests, JNDI everywhere else
        // relies on the existence of context.xml deployed in Tomcat's conf folder
        jndiDataSourceName = "java:comp/env/jdbc/hub"
        //timeout = "30 seconds" //time to wait before db gives up, in seconds.
        createTablesOnStart = false
    }
  }

  lucene {
    directory = "/usr/local/shrine/conf/lucene_index"
    suggestDirectory = "/usr/local/shrine/conf/suggest_index"
  }

  webclient {
    siteAdminEmail = "shrine-admin@example.com"
  }

  hiveCredentials {
    username = "demo"
    crcProjectId = "Demo"
  }//hiveCredentials

  adapter {
    create = true
  }//adapter

  keystore {
    file = "/usr/local/shrine/conf/shrine-keystores/"${NODE_NAME}"/shrine.keystore"
    privateKeyAlias = ${NODE_NAME}
    caCertAliases = [shrine-webclient-ca]
  }//keystore

  kafka {
    ssl.truststore.location = "/usr/local/kafka/truststore/kafka-1/shrine.keystore"
  }//kafka

  breakdownResultOutputTypes {
    //use breakdown values appropriate for your shrine network
    //in addition to default

    PATIENT_TOP20MEDS_XML {
       description = "Top 20 Medications"
       category = "Medications"
    }

    PATIENT_TOP25MEDS_XML {
       description = "Top 25 Medications"
       category = "Medications"
    }

    PATIENT_INOUT_XML {
       description = "Inpatient and outpatient breakdown"
       category = "Visits"
    }
  }//breakdownResultOutputTypes

}//shrine
