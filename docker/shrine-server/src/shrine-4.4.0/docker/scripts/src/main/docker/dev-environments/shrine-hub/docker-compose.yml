version: '3.5'

services:

  i2b2-web:
    image: i2b2/i2b2-web:${I2B2_WEB_TAG}
    container_name: i2b2-web
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    command: /run-httpd.sh localhost
    networks:
      - shrine-hub-net
    depends_on:
      - i2b2-wildfly

  i2b2-wildfly:
    image: ${DOCKER_REGISTRY_URL}shrine-i2b2-wildfly:${SHRINE_VERSION}
    container_name: i2b2-wildfly
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:9990:9990"
    networks:
      - shrine-hub-net
    depends_on:
      - i2b2-mssql

  i2b2-mssql-vol-loader:
    image: i2b2/i2b2-mssql-vol:${I2B2_MSSQL_TAG}
    container_name: i2b2-mssql-vol-loader
    volumes:
      - i2b2-mssql-vol:/var/opt/mssql
    entrypoint: /bin/sh
    networks:
      - shrine-hub-net

  i2b2-mssql:
    image: mcr.microsoft.com/mssql/server:2017-latest
    container_name: i2b2-mssql
    ports:
      - "127.0.0.1:1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${I2B2_MSSQL_SA_PASSWORD}
    networks:
      - shrine-hub-net
    volumes:
      - i2b2-mssql-vol:/var/opt/mssql
    depends_on:
      - i2b2-mssql-vol-loader

  shrine-hub:
    depends_on:
      - shrinedb
      - shrine-certs
#      - kafka-1
#      - kafka-2
    image: ${DOCKER_REGISTRY_URL}shrine-node:${SHRINE_VERSION}
    ports:
      - "127.0.0.1:6443:6443"
      - "127.0.0.1:8000:8000"
    environment:
      JPDA_ADDRESS: "*:8000"
      JPDA_TRANSPORT: dt_socket
      NODE_NAME: shrine-hub
    command: ["wait-for-it", "shrinedb:3306", "--", "/tmp/startup.sh", "${SHRINE_VERSION}"]
    volumes:
      - ${LUCENE_INDEX:?err}:/usr/local/shrine/conf/lucene_index
      - ${SUGGEST_INDEX:?err}:/usr/local/shrine/conf/suggest_index
      - ${ADAPTER_MAPPINGS:?err}:/usr/local/tomcat/lib/AdapterMappings.csv
      - $PWD/src/main/docker/dev-environments/shrine-hub/override.conf:/usr/local/tomcat/lib/override.conf
      - $PWD/src/main/docker/dev-environments/shrine-hub/startup.sh:/tmp/startup.sh
      - $PWD/src/main/docker/dev-environments/shrine-hub/network-setup/network.conf:/tmp/network.conf
      - $PWD/src/main/docker/dev-environments/shrine-hub/network-setup/override.conf:/tmp/override.conf
      - shrine-keystore-vol:/usr/local/shrine/conf/shrine-keystores:ro
#      - shrine-kafka-truststore-vol:/usr/local/kafka/truststore:ro
    networks:
      - i2b2-net
      - shrine-hub-net

  shrinedb:
    image: ${DOCKER_REGISTRY_URL}shrine-mysql:${SHRINE_VERSION}
    ports:
      - "127.0.0.1:3309:3306"
    restart: always
    volumes:
      - shrinedb-mysql-vol:/var/lib/mysql
    networks:
      - shrine-hub-net

volumes:
  i2b2-mssql-vol:
  shrinedb-mysql-vol:











