# =============================================================================
# TEMPLATE for src/configs/<env>/<project>/creds.conf (git-ignored per env).
# Copy to that path and replace every {{PLACEHOLDER}}. Loaded by shrine.conf.
#
#   {{SMTP_PASSWORD}}      javax mail authenticator password (use "changeit" if email disabled)
#   {{KEYSTORE_PASSWORD}}  SHRINE JKS keystore password (must match the keystore scripts)
#   {{HIVE_PASSWORD}}      i2b2 PM password for the SHRINE 'shrine' user (4.4.1 requires this)
# =============================================================================
email.javaxmail.authenticator.password = "{{SMTP_PASSWORD}}"
shrine.keystore.password = "{{KEYSTORE_PASSWORD}}"
shrine.hiveCredentials.password = "{{HIVE_PASSWORD}}"

