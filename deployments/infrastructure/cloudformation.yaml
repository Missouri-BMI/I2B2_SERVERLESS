AWSTemplateFormatVersion: '2010-09-09'
Description: >
  i2b2 / SHRINE shared network (OPTIONAL / greenfield) — VPC (2 public + 2 private
  subnets), NAT, and the ECS Fargate cluster. Security groups + ALB/target groups live in
  the per-app network-edge stacks; ECR + roles + logs in the platform stack. Skip this stack
  if the VPC + cluster already exist and pass their ids to the app stacks as parameters.

Parameters:
  EnvironmentName:
    Description: Name prefix for resources and exports (e.g. i2b2-dev, i2b2-prod)
    Type: String
    Default: i2b2
    AllowedPattern: (^[a-z][a-z0-9-]+$)
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: ([0-9]{1,3}\.){3}[0-9]{1,3}($|/(16|24))
  PublicSubnetOneCidr:
    Type: String
    Default: 10.0.1.0/24
  PublicSubnetTwoCidr:
    Type: String
    Default: 10.0.2.0/24
  PrivateSubnetOneCidr:
    Type: String
    Default: 10.0.3.0/24
  PrivateSubnetTwoCidr:
    Type: String
    Default: 10.0.4.0/24

Resources:

  # ----------------------------- Networking -----------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Sub '${EnvironmentName}-vpc' }]

  PublicSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs { Ref: 'AWS::Region' }]
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetOneCidr
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${EnvironmentName}-public-1' }, { Key: subnet-type, Value: Public }]

  PublicSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs { Ref: 'AWS::Region' }]
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetTwoCidr
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${EnvironmentName}-public-2' }, { Key: subnet-type, Value: Public }]

  PrivateSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs { Ref: 'AWS::Region' }]
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetOneCidr
      Tags: [{ Key: Name, Value: !Sub '${EnvironmentName}-private-1' }, { Key: subnet-type, Value: Private }]

  PrivateSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs { Ref: 'AWS::Region' }]
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetTwoCidr
      Tags: [{ Key: Name, Value: !Sub '${EnvironmentName}-private-2' }, { Key: subnet-type, Value: Private }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub '${EnvironmentName}-igw' }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: !Sub '${EnvironmentName}-public-rt' }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetOneRTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnetOne }
  PublicSubnetTwoRTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnetTwo }

  NatEIP:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc, Tags: [{ Key: Name, Value: !Sub '${EnvironmentName}-nat-eip' }] }

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnetOne
      Tags: [{ Key: Name, Value: !Sub '${EnvironmentName}-nat' }]

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: !Sub '${EnvironmentName}-private-rt' }]

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetOneRTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PrivateRouteTable, SubnetId: !Ref PrivateSubnetOne }
  PrivateSubnetTwoRTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PrivateRouteTable, SubnetId: !Ref PrivateSubnetTwo }


  # ----------------------------- ECS cluster -----------------------------
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-cluster'
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]
      CapacityProviders: [FARGATE, FARGATE_SPOT]
      DefaultCapacityProviderStrategy:
        - { CapacityProvider: FARGATE, Weight: 1 }


Outputs:
  VpcId:                 { Value: !Ref VPC, Export: { Name: !Sub '${AWS::StackName}-VpcId' } }
  PublicSubnetOne:       { Value: !Ref PublicSubnetOne, Export: { Name: !Sub '${AWS::StackName}-PublicSubnetOne' } }
  PublicSubnetTwo:       { Value: !Ref PublicSubnetTwo, Export: { Name: !Sub '${AWS::StackName}-PublicSubnetTwo' } }
  PrivateSubnetOne:      { Value: !Ref PrivateSubnetOne, Export: { Name: !Sub '${AWS::StackName}-PrivateSubnetOne' } }
  PrivateSubnetTwo:      { Value: !Ref PrivateSubnetTwo, Export: { Name: !Sub '${AWS::StackName}-PrivateSubnetTwo' } }
  ClusterName:           { Value: !Ref ECSCluster, Export: { Name: !Sub '${AWS::StackName}-ClusterName' } }
  ClusterArn:            { Value: !GetAtt ECSCluster.Arn, Export: { Name: !Sub '${AWS::StackName}-ClusterArn' } }
